[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kalman-seismic-denoising"
version = "1.0.0"
description = "Kalman-filter random-noise attenuation of seismic data, with Savitzky-Golay, f-x and SVD baselines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammad-Amin Aminian" }]
keywords = ["seismic", "kalman filter", "denoising", "geophysics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.22", "scipy>=1.8", "matplotlib>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
kalman-denoise-reproduce = "kalman_denoise.reproduce:main"

[project.urls]
Repository = "https://github.com/MohammadAmin-Aminian/kalman-seismic-denoising"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
